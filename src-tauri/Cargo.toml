[package]
name = "openscrcpy"
version = "2.0.0"
authors = ["yanhenrique-dev"]
description = "A modern desktop GUI for controlling Android devices"
license = "MIT"
repository = "https://github.com/yanhenrique-dev/OpenScrcpy"
homepage = "https://github.com/yanhenrique-dev/OpenScrcpy"
keywords = ["android", "scrcpy", "tauri", "gui"]
categories = ["gui"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_scrcpy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# UI-agnostic domain: validation, process helpers, downloads, audio policy.
# No Tauri/GPUI types may leak into this crate.
open-scrcpy-core = { path = "../crates/open-scrcpy-core" }
open-scrcpy-platform = { path = "../crates/open-scrcpy-platform" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1.49.0", features = ["full"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-notification = "2.8.1"
chrono = "0.4.43"
# Global OS shortcuts: Ctrl+Alt+Shift+C to recentre the active mirror window
# (all platforms) and Ctrl+Alt+Shift+W to drag the borderless scrcpy window
# with the mouse (Windows-only). See src/shortcuts.rs and src/grab.rs.
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
# Two app windows share the same scrcpy-bin staging paths; one instance only
# is also one adb poller and one updater.
tauri-plugin-single-instance = "2.5.4"

# Linux-only: KWin scripting bridge over D-Bus, used to read and set the
# scrcpy window geometry on KDE Wayland (where xdotool cannot see windows).
# Already in the tree via tauri-plugin-opener/single-instance.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# libappindicator loads the Ayatana library at runtime and panics when it is
# missing. Probe it first so enabling the tray can fail with a clear error
# instead of crashing the whole app. Already in the tree via tray-icon.
libloading = "0.7"

# Windows-only: read the scrcpy mirror window's client-area position natively
# (EnumWindows + ClientToScreen) to persist it across sessions. Pinned to the
# 0.61 line already resolved transitively by tao/wry, so Cargo unifies onto a
# single compiled copy (no duplicate `windows` version).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
