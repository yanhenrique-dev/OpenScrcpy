name: Pull Request CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check Frontend (Svelte + TypeScript)
        run: npm run lint

      - name: Test Frontend
        run: npm test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Lint Backend (Rust)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test Backend (Rust)
        run: cargo test
        working-directory: src-tauri

      - name: Test extracted crates (Rust)
        shell: bash
        env:
          # Reuse the shell's target directory so CI does not compile the same
          # dependency graph three times.
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: |
          for crate in crates/open-scrcpy-core crates/open-scrcpy-platform; do
            echo "::group::$crate"
            (cd "$crate" && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test)
            echo "::endgroup::"
          done

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cargo audit --file src-tauri/Cargo.lock

  build-check:
    runs-on: ubuntu-22.04
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-ubuntu-22.04-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-ubuntu-22.04-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Build Check
        run: npm run tauri build -- --no-bundle
