name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require RELEASE_TOKEN
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN is not configured. Create a fine-grained PAT with contents:write (and workflow if tags must trigger workflows), save it as RELEASE_TOKEN, or use the documented manual release process."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # Use a PAT to allow triggering other workflows

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json version
        run: |
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update tauri.conf.json
        run: |
          # Use jq to update version in tauri.conf.json
          jq ".version = \"${{ env.NEW_VERSION }}\"" src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Update Cargo.toml
        run: |
          # Use sed to update version in Cargo.toml [package] section
          sed -i "s/^version = \".*\"/version = \"${{ env.NEW_VERSION }}\"/" src-tauri/Cargo.toml

      - name: Update Cargo.lock
        run: |
          # Keep the committed lock in sync with the bumped [package] version,
          # otherwise every local build dirties the tree right after the merge.
          sed -i '/^name = "openscrcpy"$/ { n; s/^version = ".*"/version = "${{ env.NEW_VERSION }}"/ }' src-tauri/Cargo.lock
          grep -A1 '^name = "openscrcpy"$' src-tauri/Cargo.lock | grep -q "version = \"${{ env.NEW_VERSION }}\"" \
            || { echo "Cargo.lock version not updated"; exit 1; }

      - name: Create Pull Request
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          BRANCH="chore/version-bump-v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to v${NEW_VERSION}"
          git push origin "$BRANCH"

          # GitHub creates a pull request through the
          # POST /repos/{owner}/{repo}/pulls route. The body is built with
          # printf on a single line: a multi-line shell string would put
          # unindented lines inside `run: |` and break the YAML block scalar.
          BODY=$(printf 'Bumping version to v%s\n- Bump type: %s\n- Updated: package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock' "$NEW_VERSION" "$BUMP_TYPE")
          PAYLOAD=$(jq -n \
            --arg title "chore: bump version to v${NEW_VERSION}" \
            --arg head "$BRANCH" \
            --arg base "main" \
            --arg body "$BODY" \
            '{title: $title, head: $head, base: $base, body: $body}')

          RESPONSE=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls")
          echo "$RESPONSE" | jq -r '.html_url // .message'
          echo "$RESPONSE" | jq -e '.html_url' >/dev/null
