name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first: a feature
        request that explains the use case is much easier to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow that is awkward or impossible today.
      placeholder: When I record a session on a phone with a notch, ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should OpenScrcpy do? Mention the screen and the controls involved.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, or how other tools handle it.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, scrcpy options, Android version, or links that help.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and the guide.
          required: true
        - label: This request is about OpenScrcpy, not about the upstream scrcpy core.
          required: true
