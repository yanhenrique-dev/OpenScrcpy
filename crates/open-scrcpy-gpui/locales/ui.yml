    ar: "تعيين كميكروفون افتراضي"
  micSetDefaultSourceTooltip:
    en: "Linux: make Monitor of OpenScrcpy Mic the system default input while the bridge runs, and restore the previous default when it stops. Some apps keep their own selected device. Applies to new sessions."
    fr: "Linux : utilise « Monitor of OpenScrcpy Mic » comme entrée par défaut du système pendant le pont, puis restaure l'ancienne entrée à l'arrêt. Certaines applications conservent leur propre périphérique. S'applique aux nouvelles sessions."
    pt-BR: "Linux: torna Monitor of OpenScrcpy Mic a entrada padrão do sistema enquanto a ponte corre, e restaura o default anterior ao parar. Algumas apps mantêm o dispositivo que já escolheram. Aplica-se a novas sessões."
    zh-CN: "Linux：桥接运行期间将 Monitor of OpenScrcpy Mic 设为系统默认输入，停止时恢复之前的默认设备。部分应用会保留自己选择的设备。仅适用于新会话。"
    zh-TW: "Linux：橋接執行期間將 Monitor of OpenScrcpy Mic 設為系統預設輸入，停止時還原先前的預設裝置。部分應用程式會保留自己選擇的裝置。僅適用於新工作階段。"
    ru: "Linux: использовать Monitor of OpenScrcpy Mic как системный вход по умолчанию, пока работает мост, и восстановить предыдущий вход при остановке. Некоторые приложения сохраняют собственное устройство. Применяется к новым сеансам."
    id: "Linux: jadikan Monitor of OpenScrcpy Mic input default sistem selama jembatan berjalan, lalu pulihkan default sebelumnya saat berhenti. Sebagian aplikasi tetap memakai perangkat pilihannya sendiri. Berlaku untuk sesi baru."
    ar: "Linux: اجعل Monitor of OpenScrcpy Mic إدخال النظام الافتراضي أثناء تشغيل الجسر، واستعد الإدخال السابق عند التوقف. بعض التطبيقات تحتفظ بالجهاز الذي اختارته. ينطبق على الجلسات الجديدة."
