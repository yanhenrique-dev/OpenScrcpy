  micStartHint:
    en: "The bridge shows up in the console: scrcpy's log follows the audio flow."
    fr: "Le pont apparaît dans la console : le log de scrcpy suit le flux audio."
    pt-BR: "A ponte aparece no console: o log do scrcpy mostra o fluxo do áudio."
    zh-CN: "桥接显示在控制台中：scrcpy 日志会跟踪音频流。"
    zh-TW: "橋接顯示在主控台中：scrcpy 記錄會追蹤音訊流。"
    ru: "Мост виден в консоли: журнал scrcpy отражает поток аудио."
    id: "Jembatan tampil di konsol: log scrcpy mengikuti aliran audio."
    ar: "يظهر الجسر في الطرفية: سجل scrcpy يتتبع تدفق الصوت."
  micStopHint:
    en: "No window and no separate app: end it with the Stop button; each state shows in the console."
    fr: "Ni fenêtre ni app dédiée : terminez avec le bouton Arrêter ; chaque état s'affiche dans la console."
    pt-BR: "Sem janela e sem app dedicado: para encerrar, use o botão Parar; cada estado aparece no console."
    zh-CN: "无窗口、无独立应用：用停止按钮结束；每个状态都会显示在控制台。"
    zh-TW: "無視窗、無獨立應用程式：以停止按鈕結束；每個狀態都會顯示在主控台。"
    ru: "Ни окна, ни отдельного приложения: завершение — кнопкой «Стоп»; каждое состояние видно в консоли."
    id: "Tanpa jendela/aplikasi terpisah: akhiri lewat tombol Hentikan; setiap status tampil di konsol."
    ar: "لا نافذة ولا تطبيق منفصل: أنهِه بزر الإيقاف؛ كل حالة تظهر في الطرفية."
