    fr: "Sans Bordures"
    pt-BR: "Sem Bordas"
    zh-CN: "无边框"
    zh-TW: "無邊框"
    ru: "Без рамок"
    id: "Tanpa Border"
    ar: "بدون إطار"
  borderlessTooltip:
    en: "Launch scrcpy without window borders. Position is remembered between sessions. To move the window: Ctrl+Alt+Shift+W on Windows, Super/Meta+drag on GNOME/KDE. If it ever ends up off-screen, press Ctrl+Alt+Shift+C to snap it back to the centre."
    fr: "Lance scrcpy sans bordures de fenêtre. La position est mémorisée entre les sessions. Pour déplacer la fenêtre : Ctrl+Alt+Shift+W sous Windows, Super/Meta+glisser sous GNOME/KDE. Si jamais elle se retrouve hors de l'écran, appuyez sur Ctrl+Alt+Shift+C pour la recentrer."
    pt-BR: "Inicia o scrcpy sem bordas de janela. A posição é lembrada entre sessões. Para mover a janela: Ctrl+Alt+Shift+W no Windows, Super/Meta+arrastar no GNOME/KDE. Se ela sair da tela, pressione Ctrl+Alt+Shift+C para recentralizá-la."
    zh-CN: "启动 scrcpy 时不显示窗口边框。窗口位置会在会话间记住。移动窗口：Windows 上按 Ctrl+Alt+Shift+W，GNOME/KDE 上用 Super/Meta+拖动。如果窗口跑到屏幕外，按 Ctrl+Alt+Shift+C 可将其重新居中。"
    zh-TW: "無視窗邊框模式。視窗位置會在工作階段之間記住。移動視窗：Windows 上按 Ctrl+Alt+Shift+W，GNOME/KDE 上用 Super/Meta+拖曳。如果視窗跑到螢幕外，按 Ctrl+Alt+Shift+C 可將其重新置中。"
    ru: "Запускать scrcpy без рамки окна. Позиция запоминается между сессиями. Чтобы переместить окно: Ctrl+Alt+Shift+W в Windows, Super/Meta+перетаскивание в GNOME/KDE. Если окно окажется за пределами экрана, нажмите Ctrl+Alt+Shift+C, чтобы вернуть его по центру."
    id: "Jalankan scrcpy tanpa bingkai jendela. Posisi diingat antar sesi. Untuk memindahkan jendela: Ctrl+Alt+Shift+W di Windows, Super/Meta+seret di GNOME/KDE. Jika jendela sampai keluar dari layar, tekan Ctrl+Alt+Shift+C untuk mengembalikannya ke tengah."
    ar: "تشغيل Scrcpy بدون حدود للنافذة."
  rememberWindowPosition:
    en: "Remember window position"
    fr: "Mémoriser la position de la fenêtre"
    pt-BR: "Lembrar Posição da Janela"
    zh-CN: "记住窗口位置"
    zh-TW: "記住視窗位置"
    ru: "Запоминать позицию окна"
    id: "Ingat Posisi Jendela"
    ar: "تذكر موضع النافذة"
  rememberWindowPositionTooltip:
    en: "Reopen the mirror window at the same spot it was last placed. Turn this off if you often change resolution -- it can throw off the saved spot. If it ever ends up off-screen, press Ctrl+Alt+Shift+C to snap it back to the centre."
    fr: "Rouvre la fenêtre de mirroring au même endroit que la dernière fois. Désactivez si vous changez souvent de résolution, ça peut sinon perturber la position enregistrée. Si elle se retrouve hors de l'écran, appuyez sur Ctrl+Alt+Shift+C pour la recentrer."
    pt-BR: "Reabre a janela de espelhamento no mesmo lugar em que estava. Desative se você muda de resolução com frequência -- isso pode bagunçar a posição salva. Se ela sair da tela, pressione Ctrl+Alt+Shift+C para recentralizá-la."
    zh-CN: "在上次的位置重新打开镜像窗口。如果你经常切换分辨率，建议关闭此项，否则可能打乱已保存的位置。如果窗口跑到屏幕外，按 Ctrl+Alt+Shift+C 可将其重新居中。"
    zh-TW: "在上次的位置重新開啟鏡像視窗。如果你經常切換解析度，建議關閉此項，否則可能打亂已儲存的位置。如果視窗跑到螢幕外，按 Ctrl+Alt+Shift+C 可將其重新置中。"
    ru: "Открывать окно трансляции там же, где оно было в прошлый раз. Отключите, если вы часто меняете разрешение -- это может сбить сохранённую позицию. Если окно окажется за пределами экрана, нажмите Ctrl+Alt+Shift+C, чтобы вернуть его по центру."
    id: "Buka kembali jendela mirroring di posisi terakhir. Nonaktifkan jika Anda sering mengganti resolusi -- ini bisa mengacaukan posisi yang tersimpan. Jika jendela sampai keluar dari layar, tekan Ctrl+Alt+Shift+C untuk mengembalikannya ke tengah."
    ar: "إعادة فتح نافذة العرض في نفس المكان الذي وُضعت فيه آخر مرة. عطّل هذا الخيار إذا كنت تغيّر الدقة بشكل متكرر، فقد يفسد الموضع المحفوظ. إذا انتهى بها الأمر خارج الشاشة، اضغط Ctrl+Alt+Shift+C لإعادتها إلى المنتصف."
