    en: "This device isn't on the pairing screen yet. On the phone, open Wireless debugging > Pair device with pairing code, then it will show up here ready to pair."
    fr: "Cet appareil n'est pas encore sur l'écran d'appairage. Sur le téléphone, ouvrez Débogage sans fil > Appairer l'appareil avec un code d'appairage, il apparaîtra alors ici prêt à être appairé."
    pt-BR: "Este dispositivo ainda não está na tela de pareamento. No telefone, abra Depuração sem fio > Parear dispositivo com código, e ele aparecerá aqui pronto para parear."
    zh-CN: "该设备目前不在配对界面。请在手机上打开\"无线调试 > 使用配对码配对设备\"，之后它就会显示在这里，可以配对。"
    zh-TW: "該裝置目前不在配對畫面。請在手機上開啟「無線偵錯 > 使用配對碼配對裝置」，之後它就會顯示在這裡，可以配對。"
    ru: "Это устройство ещё не на экране сопряжения. На телефоне откройте «Отладка по Wi-Fi» > «Сопряжение через код», и оно появится здесь готовым к сопряжению."
    id: "Perangkat ini belum berada di layar penyandingan. Di ponsel, buka Debugging nirkabel > Sandingkan perangkat dengan kode sandi, lalu perangkat akan muncul di sini siap disandingkan."
    ar: "هذا الجهاز ليس في شاشة الإقران بعد. على الهاتف، افتح التصحيح اللاسلكي > إقران جهاز برمز الإقران، وسيظهر هنا جاهزًا للإقران."
