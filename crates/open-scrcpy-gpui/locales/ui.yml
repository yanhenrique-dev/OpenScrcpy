    pt-BR: "Encaminhar Áudio"
    zh-CN: "转发音频"
    zh-TW: "傳送音訊"
    ru: "Передавать аудио"
    id: "Teruskan Audio"
    ar: "نقل الصوت"
  forwardAudioTooltip:
    en: "Requires Android 11 or newer. Android 12+ works out of the box. On Android 11, the device must be unlocked before starting. Some apps and Android TV devices block audio capture; the console shows an [AUDIO] warning when that happens. In Camera mode the phone microphone is forwarded instead of the device output."
    fr: "Nécessite Android 11 ou plus récent. Android 12+ fonctionne normalement directement. Sur Android 11, l'appareil doit être déverrouillé avant le lancement, mais la capture audio peut rester indisponible sur certains appareils Android TV. En mode Caméra, le micro du téléphone est transmis au lieu de la sortie audio du téléphone."
    pt-BR: "Requer Android 11 ou mais recente. Android 12+ funciona normalmente sem configuração adicional. No Android 11, o dispositivo deve estar desbloqueado antes de iniciar. Alguns apps e dispositivos Android TV bloqueiam a captura; o console mostra um aviso [AUDIO] quando isso acontece. No modo Câmera, o microfone do telemóvel é encaminhado em vez da saída de áudio do dispositivo."
    zh-CN: "将音频转发到电脑。在相机模式下，转发手机麦克风而不是设备音频输出。"
    zh-TW: "將音訊傳送至電腦。在相機模式下，轉發手機麥克風而不是裝置音訊輸出。"
    ru: "Требуется Android 11 или новее.\nAndroid 12+ обычно работает сразу.\nНа Android 11 устройство должно быть разблокировано перед запуском, но захват аудио всё равно может быть недоступен на некоторых устройствах Android TV. В режиме камеры передаётся микрофон телефона, а не аудиовыход устройства."
    id: "Butuh Android 11+. Di Android 12+ langsung aktif. Di Android 11, HP harus dibuka kuncinya sebelum mulai. Perekaman audio mungkin tidak berfungsi di beberapa Android TV. Dalam mode Kamera, mikrofon ponsel diteruskan alih-alih keluaran audio perangkat."
    ar: "يتطلب Android 11 أو أحدث. يعمل Android 12 والإصدارات الأحدث مباشرة. في Android 11 يجب إلغاء قفل الجهاز قبل البدء، وقد لا يكون التقاط الصوت متاحًا على بعض أجهزة Android TV. في وضع الكاميرا، يُنقل ميكروفون الهاتف بدلاً من مخرج صوت الجهاز."
  audioCodec:
    en: "Audio codec"
    fr: "Codec audio"
    pt-BR: "Codec de áudio"
    zh-CN: "音频编码"
    zh-TW: "音訊編碼"
    ru: "Аудиокодек"
    id: "Codec audio"
    ar: "برنامج ترميز الصوت"
  audioCodecTooltip:
    en: "Automatically tries compatible audio codecs if the default one fails."
    fr: "Essaie automatiquement les codecs audio compatibles si celui par défaut échoue."
    pt-BR: "Tenta automaticamente codecs de áudio compatíveis se o padrão falhar."
    zh-CN: "如果默认编码失败，会自动尝试兼容的音频编码。"
    zh-TW: "若預設編碼失敗，會自動嘗試相容的音訊編碼。"
    ru: "Автоматически пробует совместимые аудиокодеки, если кодек по умолчанию не сработал."
    id: "Secara otomatis mencoba codec audio yang kompatibel jika codec bawaan gagal."
    ar: "يحاول تلقائيًا استخدام برامج ترميز صوت متوافقة إذا فشل البرنامج الافتراضي."
  requireAudio:
    en: "Require audio"
    fr: "Audio obligatoire"
    pt-BR: "Exigir áudio"
    zh-CN: "要求音频"
    zh-TW: "要求音訊"
    ru: "Требовать аудио"
    id: "Wajib audio"
    ar: "يتطلب الصوت"
  requireAudioTooltip:
    en: "Stop the session if the device cannot capture audio instead of mirroring video only. Off by default so older devices still work."
    fr: "Arrête la session si l'appareil ne peut pas capturer l'audio au lieu de ne diffuser que la vidéo. Désactivé par défaut pour les appareils anciens."
    pt-BR: "Encerra a sessão se o dispositivo não capturar áudio, em vez de espelhar apenas vídeo. Desativado por padrão para funcionar em dispositivos antigos."
    zh-CN: "当设备无法捕获音频时结束会话，而不是仅镜像视频。默认关闭以兼容旧设备。"
    zh-TW: "當裝置無法擷取音訊時結束工作階段，而不是僅鏡像影片。預設關閉以相容舊裝置。"
    ru: "Завершать сессию, если устройство не может захватить аудио, вместо зеркалирования только видео. По умолчанию выключено для совместимости со старыми устройствами."
    id: "Hentikan sesi jika perangkat tidak dapat menangkap audio, alih-alih hanya mencerminkan video. Nonaktif secara default agar perangkat lama tetap berfungsi."
    ar: "إيقاف الجلسة إذا تعذر على الجهاز التقاط الصوت بدلاً من عرض الفيديو فقط. معطل افتراضيًا لدعم الأجهزة القديمة."
  audioSource:
    en: "Audio source"
    fr: "Source audio"
    pt-BR: "Fonte de áudio"
    zh-CN: "音频来源"
    zh-TW: "音訊來源"
    ru: "Источник звука"
    id: "Sumber audio"
    ar: "مصدر الصوت"
  audioSourceTooltip:
    en: "Audio captured by the PC in Mirror mode. Device output mutes the phone while mirroring. Media playback captures app audio (Android 13+; apps can opt out). Phone microphone captures the phone mic. Voice call and voice performance depend on Android and app support."
    fr: "Audio capturé par le PC en mode miroir. La sortie de l'appareil coupe le son du téléphone pendant le miroir. La lecture multimédia capture l'audio des applications (Android 13+ ; certaines peuvent s'y opposer). Le micro du téléphone capture le micro. L'appel vocal et la performance vocale dépendent d'Android et de la prise en charge des applications."
    pt-BR: "Áudio capturado pelo PC no modo espelho. A saída do dispositivo silencia o telemóvel enquanto espelha. A reprodução de media capta o áudio das apps (Android 13+; algumas podem optar por não). O microfone do telemóvel capta o mic. A chamada de voz e o desempenho de voz dependem do Android e do suporte das apps."
    zh-CN: "镜像模式下电脑采集的音频。设备输出会在镜像时静音手机。媒体播放采集应用音频（Android 13+；部分应用可选择退出）。手机麦克风采集手机麦克风。语音通话和语音表演取决于 Android 和应用支持。"
    zh-TW: "鏡像模式下電腦擷取的音訊。裝置輸出會在鏡像時將手機靜音。媒體播放擷取應用程式音訊（Android 13+；部分應用程式可選擇退出）。手機麥克風擷取手機麥克風。語音通話和語音表演取決於 Android 和應用程式支援。"
    ru: "Звук, который захватывает ПК в режиме зеркалирования. Вывод устройства отключает звук телефона во время зеркалирования. Воспроизведение мультимедиа захватывает звук приложений (Android 13+; некоторые могут отказаться). Микрофон телефона захватывает микрофон. Голосовой вызов и голосовое исполнение зависят от Android и поддержки приложений."
    id: "Audio yang ditangkap PC dalam mode mirror. Output perangkat membisukan ponsel saat mirroring. Pemutaran media menangkap audio aplikasi (Android 13+; sebagian aplikasi dapat memilih keluar). Mikrofon ponsel menangkap mikrofon ponsel. Panggilan suara dan performa suara bergantung pada Android dan dukungan aplikasi."
    ar: "الصوت الذي يلتقطه الكمبيوتر في وضع النسخ. إخراج الجهاز يكتم صوت الهاتف أثناء النسخ. تشغيل الوسائط يلتقط صوت التطبيقات (Android 13+؛ بعض التطبيقات قد تختار عدم المشاركة). ميكروفون الهاتف يلتقط الميكروفون. تعتمد مكالمة الصوت والأداء الصوتي على Android ودعم التطبيقات."
