  micBridgeDesc:
    en: "Windowless: your phone's microphone reaches the PC as an audio input. Pick \"Monitor of OpenScrcpy Mic\" as the microphone in Discord, OBS or your recorder (some apps label it \"OpenScrcpy Mic\")."
    fr: "Sans fenêtre : le micro du téléphone arrive sur le PC comme entrée audio. Choisissez « Monitor of OpenScrcpy Mic » comme micro dans Discord, OBS ou votre enregistreur (certaines applications affichent « OpenScrcpy Mic »)."
    pt-BR: "Sem janela: o microfone do celular chega ao PC como entrada de áudio. Escolha \"Monitor of OpenScrcpy Mic\" como microfone no Discord, OBS ou gravador (algumas apps mostram \"OpenScrcpy Mic\")."
    zh-CN: "无窗口：手机麦克风以音频输入的形式到达电脑。在 Discord、OBS 或录屏软件中选择「Monitor of OpenScrcpy Mic」作为麦克风（部分应用显示为「OpenScrcpy Mic」）。"
    zh-TW: "無視窗：手機麥克風以音訊輸入的形式到達電腦。在 Discord、OBS 或錄音程式中選擇「Monitor of OpenScrcpy Mic」作為麥克風（部分應用程式顯示為「OpenScrcpy Mic」）。"
    ru: "Без окна: микрофон телефона поступает на ПК как аудиовход. Выберите «Monitor of OpenScrcpy Mic» как микрофон в Discord, OBS или рекордере (некоторые приложения показывают «OpenScrcpy Mic»)."
    id: "Tanpa jendela: mikrofon ponsel masuk ke PC sebagai input audio. Pilih \"Monitor of OpenScrcpy Mic\" sebagai mikrofon di Discord, OBS, atau perekam (sebagian aplikasi menampilkannya sebagai \"OpenScrcpy Mic\")."
    ar: "بدون نافذة: يصل ميكروفون الهاتف إلى الحاسوب كمدخَل صوتي. اختر \"Monitor of OpenScrcpy Mic\" كميكروفون في Discord أو OBS أو المسجل (بعض التطبيقات تعرضه باسم \"OpenScrcpy Mic\")."
  micAndroidReq:
    en: "Requires Android 11 or newer. On Android 11, unlock the device before starting; Android 12+ works out of the box. Allow microphone permission on the phone."
    fr: "Nécessite Android 11 ou plus récent. Sous Android 11, déverrouillez le téléphone avant de démarrer ; Android 12+ fonctionne directement. Autorisez le micro sur le téléphone."
    pt-BR: "Requer Android 11 ou superior. No Android 11, desbloqueie o celular antes de iniciar; Android 12+ funciona sem esse passo. Permita o microfone no celular."
    zh-CN: "需要 Android 11 或更高版本。Android 11 需在开始前解锁手机；Android 12+ 可直接使用。请在手机上允许麦克风权限。"
    zh-TW: "需要 Android 11 或更新版本。Android 11 需在開始前解鎖手機；Android 12+ 可直接使用。請在手機上允許麥克風權限。"
    ru: "Требуется Android 11 или новее. На Android 11 разблокируйте телефон перед запуском; Android 12+ работает сразу. Разрешите доступ к микрофону на телефоне."
    id: "Butuh Android 11 ke atas. Di Android 11, buka kunci ponsel sebelum memulai; Android 12+ berfungsi langsung. Izinkan mikrofon di ponsel."
    ar: "يتطلب Android 11 أو أحدث. في Android 11، افتح قفل الهاتف قبل البدء؛ Android 12+ يعمل مباشرة. اسمح بإذن الميكروفون على الهاتف."
  micDestLinux:
    en: "Linux: the virtual input \"Monitor of OpenScrcpy Mic\" is created automatically when the bridge starts."
    fr: "Linux : l'entrée virtuelle « Monitor of OpenScrcpy Mic » est créée automatiquement au démarrage du pont."
    pt-BR: "Linux: a entrada virtual \"Monitor of OpenScrcpy Mic\" é criada automaticamente quando a ponte inicia."
    zh-CN: "Linux：桥接启动时自动创建虚拟输入「Monitor of OpenScrcpy Mic」。"
    zh-TW: "Linux：橋接啟動時自動建立虛擬輸入「Monitor of OpenScrcpy Mic」。"
    ru: "Linux: виртуальный вход «Monitor of OpenScrcpy Mic» создаётся автоматически при запуске моста."
    id: "Linux: input virtual \"Monitor of OpenScrcpy Mic\" dibuat otomatis saat jembatan mulai."
    ar: "لينكس: يُنشأ الإدخال الافتراضي \"Monitor of OpenScrcpy Mic\" تلقائيًا عند بدء الجسر."
  micDestOther:
    en: "Windows/macOS: in this version audio plays to the default output (virtual driver in a future release)."
    fr: "Windows/macOS : dans cette version l'audio sort vers la sortie par défaut (pilote virtuel dans une future version)."
    pt-BR: "Windows/macOS: nesta versão o áudio sai pela saída padrão (driver virtual em versão futura)."
    zh-CN: "Windows/macOS：此版本音频会输出到默认设备（虚拟驱动将在未来版本提供）。"
    zh-TW: "Windows/macOS：此版本音訊會輸出到預設裝置（虛擬驅動將在未來版本提供）。"
    ru: "Windows/macOS: в этой версии звук идёт на стандартный вывод (виртуальный драйвер — в будущей версии)."
    id: "Windows/macOS: di versi ini audio keluar ke output bawaan (driver virtual di rilis mendatang)."
    ar: "ويندوز/ماك: في هذا الإصدار يخرج الصوت إلى المخرج الافتراضي (السائق الافتراضي في إصدار قادم)."
