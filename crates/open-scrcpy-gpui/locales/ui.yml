  vsyncTooltip:
    en: "Sync the frame display to your monitor's refresh rate to eliminate screen tearing (on by default). scrcpy 4.0 (SDL3) disables this by default. Turn off for slightly lower input latency."
    fr: "Synchronise l'affichage des images avec le rafraîchissement de ton écran pour éliminer le tearing (activé par défaut). scrcpy 4.0 (SDL3) le désactive par défaut. Désactive-le pour une latence d'entrée légèrement plus faible."
    pt-BR: "Sincroniza a exibição dos quadros com a taxa de atualização do monitor para eliminar o tearing (ativado por padrão). O scrcpy 4.0 (SDL3) desativa isso por padrão. Desligue para uma latência de entrada um pouco menor."
    zh-CN: "将画面显示与显示器的刷新率同步，消除画面撕裂（默认开启）。scrcpy 4.0（SDL3）默认禁用此功能。关闭可略微降低输入延迟。"
    zh-TW: "將畫面顯示與螢幕的更新率同步，以消除畫面撕裂（預設開啟）。scrcpy 4.0（SDL3）預設停用此功能。關閉可稍微降低輸入延遲。"
    ru: "Синхронизирует вывод кадров с частотой обновления монитора, устраняя разрывы изображения (включено по умолчанию). scrcpy 4.0 (SDL3) отключает это по умолчанию. Выключите для немного меньшей задержки ввода."
    id: "Menyinkronkan tampilan frame dengan refresh rate monitor untuk menghilangkan tearing (aktif secara default). scrcpy 4.0 (SDL3) menonaktifkannya secara default. Matikan untuk latensi input sedikit lebih rendah."
    ar: "مزامنة عرض الإطارات مع معدل تحديث الشاشة لمنع تمزق الصورة. مفعلة افتراضيًا في OpenScrcpy. يمكن إيقافها لتقليل تأخر الإدخال قليلاً."
