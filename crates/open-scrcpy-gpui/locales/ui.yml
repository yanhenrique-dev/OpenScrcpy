  audioDupTooltip:
    en: "Keep the playback audio on the phone while the PC captures it. Requires Android 13+ and an scrcpy build with --audio-dup. Only available for Media playback."
    fr: "Garde l'audio de lecture sur le téléphone pendant que le PC le capture. Nécessite Android 13+ et une version de scrcpy avec --audio-dup. Disponible uniquement pour la lecture multimédia."
    pt-BR: "Mantém o áudio de reprodução no telemóvel enquanto o PC o capta. Requer Android 13+ e uma versão do scrcpy com --audio-dup. Só disponível para reprodução de media."
    zh-CN: "在电脑采集音频的同时让手机继续播放。需要 Android 13+ 以及支持 --audio-dup 的 scrcpy。仅适用于媒体播放。"
    zh-TW: "在電腦擷取音訊的同時讓手機繼續播放。需要 Android 13+ 以及支援 --audio-dup 的 scrcpy。僅適用於媒體播放。"
    ru: "Оставляет звук воспроизведения на телефоне, пока ПК его захватывает. Требуется Android 13+ и scrcpy с --audio-dup. Доступно только для воспроизведения мультимедиа."
    id: "Menjaga audio pemutaran tetap di ponsel saat PC menangkapnya. Memerlukan Android 13+ dan scrcpy dengan --audio-dup. Hanya tersedia untuk pemutaran media."
    ar: "يبقي صوت التشغيل على الهاتف بينما يلتقطه الكمبيوتر. يتطلب Android 13+ وإصدار scrcpy يدعم --audio-dup. متاح فقط لتشغيل الوسائط."
