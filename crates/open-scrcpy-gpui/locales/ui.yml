    ar: "Skip video encoder size constraints entirely. Use this if scrcpy fails to start or has resolution issues due to the device reporting incorrect encoder limits (scrcpy v4.1+)."
appBehavior:
  title:
    en: "Application"
    fr: "Application"
    pt-BR: "Aplicativo"
    zh-CN: "应用"
    zh-TW: "應用程式"
    ru: "Приложение"
    id: "Aplikasi"
    ar: "التطبيق"
  keepInBackground:
    en: "Keep running in the background"
    fr: "Continuer en arrière-plan"
    pt-BR: "Continuar em segundo plano"
    zh-CN: "在后台继续运行"
    zh-TW: "在背景繼續執行"
    ru: "Продолжать работу в фоне"
    id: "Tetap berjalan di latar belakang"
    ar: "الاستمرار في الخلفية"
  keepInBackgroundTooltip:
    en: "Closing the window hides OpenScrcpy to the tray and keeps mirror and microphone sessions running. Choose Quit in the tray menu to stop them."
    fr: "Fermer la fenêtre masque OpenScrcpy dans la zone de notification et garde les sessions de miroir et de microphone actives. Choisissez « Quitter » dans le menu pour les arrêter."
    pt-BR: "Ao fechar a janela, o OpenScrcpy fica na bandeja e mantém as sessões de espelhamento e microfone ativas. Escolha \"Sair\" no menu da bandeja para encerrá-las."
    zh-CN: "关闭窗口时，OpenScrcpy 会隐藏到托盘，并保持镜像和麦克风会话运行。选择托盘菜单中的“退出”可停止它们。"
    zh-TW: "關閉視窗時，OpenScrcpy 會隱藏到系統匣，並保持鏡像與麥克風工作階段執行。選擇系統匣選單中的「結束」可停止它們。"
    ru: "При закрытии окна OpenScrcpy скрывается в трей, а сеансы зеркалирования и микрофона продолжают работать. Чтобы остановить их, выберите «Выход» в меню трея."
    id: "Menutup jendela akan menyembunyikan OpenScrcpy ke tray dan menjaga sesi cermin serta mikrofon tetap berjalan. Pilih Keluar di menu tray untuk menghentikannya."
    ar: "عند إغلاق النافذة يختفي OpenScrcpy إلى شريط النظام وتبقى جلسات النسخ والمايكروفون قيد التشغيل. اختر «خروج» من قائمة شريط النظام لإيقافها."
  notifications:
    en: "Native notifications"
    fr: "Notifications natives"
    pt-BR: "Notificações nativas"
    zh-CN: "原生通知"
    zh-TW: "原生通知"
    ru: "Системные уведомления"
    id: "Notifikasi bawaan"
    ar: "إشعارات النظام"
  notificationsTooltip:
    en: "Notify you about device connections, unexpected session ends and available updates. Notifications only appear while OpenScrcpy is running, and device/update notices are suppressed while the window is focused."
    fr: "Vous avertit des connexions de périphériques, des fins de session inattendues et des mises à jour disponibles. Les notifications ne s’affichent que lorsque OpenScrcpy est en cours d’exécution ; les avis de périphérique et de mise à jour sont masqués lorsque la fenêtre a le focus."
    pt-BR: "Avisa sobre dispositivos ligados/desligados, sessões terminadas inesperadamente e atualizações disponíveis. As notificações só aparecem com o OpenScrcpy aberto; avisos de dispositivos e atualizações são suprimidos enquanto a janela está em foco."
    zh-CN: "在设备连接、会话意外结束和有可用更新时通知你。通知仅在 OpenScrcpy 运行时出现；窗口处于焦点时不会显示设备和更新通知。"
    zh-TW: "在裝置連線、工作階段意外結束和有可用更新時通知你。通知僅在 OpenScrcpy 執行時出現；視窗取得焦點時不會顯示裝置與更新通知。"
    ru: "Уведомляет о подключении устройств, неожиданном завершении сеансов и доступных обновлениях. Уведомления появляются только при запущенном OpenScrcpy; уведомления об устройствах и обновлениях скрываются, когда окно в фокусе."
    id: "Memberi tahu tentang perangkat yang terhubung, sesi yang berakhir tak terduga, dan pembaruan yang tersedia. Notifikasi hanya muncul saat OpenScrcpy berjalan; pemberitahuan perangkat dan pembaruan disembunyikan saat jendela difokuskan."
    ar: "ينبهك عند توصيل الأجهزة أو انتهاء الجلسات بشكل غير متوقع أو توفر تحديثات. تظهر الإشعارات فقط أثناء تشغيل OpenScrcpy، وتُخفى إشعارات الأجهزة والتحديثات عندما تكون النافذة في المقدمة."
  autoReconnect:
    en: "Reconnect automatically"
    fr: "Reconnexion automatique"
    pt-BR: "Reconectar automaticamente"
    zh-CN: "自动重新连接"
    zh-TW: "自動重新連線"
    ru: "Переподключаться автоматически"
    id: "Sambung ulang otomatis"
    ar: "إعادة الاتصال تلقائيًا"
  autoReconnectTooltip:
    en: "If scrcpy exits unexpectedly (USB/ADB drop or crash), retry the session with exponential backoff up to 30 seconds. A deliberate Stop or a closed scrcpy window is not reconnected. Applies to new sessions; the console logs each attempt."
    fr: "Si scrcpy se termine de façon inattendue (déconnexion USB/ADB ou plantage), réessaie la session avec un délai exponentiel allant jusqu'à 30 secondes. Un arrêt volontaire ou une fenêtre scrcpy fermée ne sont pas reconnectés. S'applique aux nouvelles sessions ; la console journalise chaque tentative."
    pt-BR: "Se o scrcpy terminar inesperadamente (queda do USB/ADB ou crash), tenta reiniciar a sessão com backoff exponencial até 30 segundos. Uma paragem deliberada ou o fecho da janela do scrcpy não são reconectados. Aplica-se a novas sessões; o console registra cada tentativa."
    zh-CN: "如果 scrcpy 意外退出（USB/ADB 断开或崩溃），使用指数退避（最长 30 秒）重试会话。主动停止或关闭 scrcpy 窗口不会重连。仅适用于新会话；控制台会记录每次尝试。"
    zh-TW: "如果 scrcpy 意外結束（USB/ADB 中斷或當機），使用指數退避（最長 30 秒）重試工作階段。主動停止或關閉 scrcpy 視窗不會重新連線。僅適用於新工作階段；主控台會記錄每次嘗試。"
    ru: "Если scrcpy завершается неожиданно (обрыв USB/ADB или сбой), повторять запуск сеанса с экспоненциальной задержкой до 30 секунд. Намеренная остановка или закрытое окно scrcpy не переподключаются. Применяется к новым сеансам; каждая попытка записывается в консоль."
    id: "Jika scrcpy berhenti secara tak terduga (USB/ADB terputus atau crash), coba mulai ulang sesi dengan backoff eksponensial hingga 30 detik. Penghentian yang disengaja atau jendela scrcpy yang ditutup tidak akan disambungkan ulang. Berlaku untuk sesi baru; konsol mencatat setiap percobaan."
    ar: "إذا انتهى scrcpy بشكل غير متوقع (انقطاع USB/ADB أو تعطل)، أعد محاولة الجلسة بتراجع أسي حتى 30 ثانية. الإيقاف المتعمد أو إغلاق نافذة scrcpy لا يعيد الاتصال. ينطبق على الجلسات الجديدة؛ وتسجل الطرفية كل محاولة."
