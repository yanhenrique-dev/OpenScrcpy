  cameraMicSinkTooltip:
    en: "Route the phone microphone from this camera session into the OpenScrcpy Mic input (select \"Monitor of OpenScrcpy Mic\" in OBS or Discord). Audio leaves the default output; if pactl is missing or the sink cannot be created, it stays there and the console shows an [MIC] warning. Linux only."
    fr: "Route le microphone du téléphone de cette session caméra vers l'entrée OpenScrcpy Mic (choisissez « Monitor of OpenScrcpy Mic » dans OBS ou Discord). L'audio quitte la sortie par défaut ; si pactl est absent ou si le sink ne peut pas être créé, il y reste et la console affiche un avertissement [MIC]. Linux uniquement."
    pt-BR: "Encaminha o microfone do telemóvel desta sessão de câmara para a entrada OpenScrcpy Mic (escolhe \"Monitor of OpenScrcpy Mic\" no OBS ou no Discord). O áudio deixa a saída padrão; se o pactl não existir ou o sink não puder ser criado, continua nessa saída e o console mostra um aviso [MIC]. Apenas no Linux."
    zh-CN: "将此次摄像头会话中的手机麦克风路由到 OpenScrcpy Mic 输入（在 OBS 或 Discord 中选择“Monitor of OpenScrcpy Mic”）。音频将离开默认输出；如果缺少 pactl 或无法创建 sink，音频仍从默认输出播放，控制台会显示 [MIC] 警告。仅限 Linux。"
    zh-TW: "將此次攝影機會話中的手機麥克風路由到 OpenScrcpy Mic 輸入（在 OBS 或 Discord 中選擇「Monitor of OpenScrcpy Mic」）。音訊將離開預設輸出；如果缺少 pactl 或無法建立 sink，音訊仍從預設輸出播放，主控台會顯示 [MIC] 警告。僅限 Linux。"
    ru: "Направляет микрофон телефона из этого сеанса камеры во вход OpenScrcpy Mic (выберите «Monitor of OpenScrcpy Mic» в OBS или Discord). Звук уходит с устройства вывода по умолчанию; если pactl отсутствует или sink не удаётся создать, он остаётся там, а в консоли появляется предупреждение [MIC]. Только Linux."
    id: "Mengarahkan mikrofon ponsel dari sesi kamera ini ke input OpenScrcpy Mic (pilih \"Monitor of OpenScrcpy Mic\" di OBS atau Discord). Audio keluar dari output default; jika pactl tidak ada atau sink tidak dapat dibuat, audio tetap di sana dan konsol menampilkan peringatan [MIC]. Hanya Linux."
    ar: "يوجّه ميكروفون الهاتف من جلسة الكاميرا هذه إلى إدخال OpenScrcpy Mic (اختر \"Monitor of OpenScrcpy Mic\" في OBS أو Discord). يغادر الصوت مخرج الصوت الافتراضي؛ وإذا لم يكن pactl متوفرًا أو تعذّر إنشاء sink، يبقى هناك ويعرض الطرفية تحذير [MIC]. على Linux فقط."
