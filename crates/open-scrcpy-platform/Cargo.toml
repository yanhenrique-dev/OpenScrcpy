[package]
name = "open-scrcpy-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "open_scrcpy_platform"
path = "src/lib.rs"

[dependencies]
global-hotkey = "0.10"
single-instance = "0.3"
tokio = { version = "1.49.0", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Windows-only: read and move the scrcpy mirror window's client area
# (EnumWindows + ClientToScreen). Kept on the same 0.61 line the Tauri shell
# resolves, so Cargo unifies onto a single compiled copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
