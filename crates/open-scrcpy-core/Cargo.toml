[package]
name = "open-scrcpy-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "open_scrcpy_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.43"
minisign-verify = "0.3"
semver = "1"
